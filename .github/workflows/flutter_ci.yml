name: Flutter CI — Build & Publish APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'          # trigger on semver tags, e.g. v1.2.3
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1 – Analyze & Test
  # ============================================================================
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

  # ============================================================================
  # Job 2 – Build APK
  # ============================================================================
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze           # only build if analysis passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Decode and restore the signing keystore ─────────────────────────────
      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        if: github.event_name != 'pull_request'
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      # ── Set up Flutter ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Set up Java 17 (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # ── Debug APK (PR only) ─────────────────────────────────────────────────
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: emenu-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # ── Release APK (push to main / tag) ───────────────────────────────────
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Upload release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: emenu-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================================
  # Job 3 – Publish a GitHub Release (only on semver tags)
  # ============================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write      # required to create a release

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: emenu-release-${{ github.sha }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Smart E-Menu Indochine ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/app-release.apk
